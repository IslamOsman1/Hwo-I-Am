services:
  - type: web
    name: menana-trivia
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./storage
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
