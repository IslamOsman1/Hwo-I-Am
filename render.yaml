services:
  - type: web
    name: menana-trivia
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: trivia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
